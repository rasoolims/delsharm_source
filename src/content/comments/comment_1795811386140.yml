message: >-
  درود و سلام. ارادت. مرور این شعر چارده سال بسیار زیبا و با معنای شده برای من
  به یاداوری رخدادی موثر وقتی به فاطمه [استادی خانم دکتر که همچون منتوری بزرگوار
  هست و نزدیک چهارده سالی امریکا بود و بازگشت و باهم کار میکنیم تخصصی در
  Neuro-Oncology و Neurology Neurosurgery و Neurosurgical Oncology] در هجدهم
  نوامبر پس از دیدار و نشستی حضوری ادامه در پیامی متنی میگفتم: 

  نگرانی من تایمینگ معنای زمان شده مث آیه نازعات "كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا
  لَمْ يَلْبَثُوا إِلَّا عَشِيَّةً أَوْ ضُحَاهَا"

  که

  میشد ای کاش از 2007 میدونستم این مسیر تخصصی منه.

  الانم خدا را شکر 2027

  . 


  اکنون با شعر چارده یاد زمان و معنای تایمینگ شد.

  درود و ارادت محمد صادق عزیز

  پیروز و سلامت باشی
